name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinomatch
          POSTGRES_PASSWORD: kinomatch
          POSTGRES_DB: kinomatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kinomatch" --health-interval 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+asyncpg://kinomatch:kinomatch@localhost:5432/kinomatch
      TEST_DATABASE_URL: postgresql+asyncpg://kinomatch:kinomatch@localhost:5432/kinomatch_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: mypy
      - name: Migrations
        run: alembic upgrade head && kinomatch seed
      - name: Tests
        run: pytest -v
